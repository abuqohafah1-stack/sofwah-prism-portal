<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0504">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>SOFWAH PRISM</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRISM">
<style>
html,body{margin:0;height:100%;background:#0a0504;color:#f6efe6;font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .4s}
iframe.on{opacity:1}
.load{position:fixed;inset:0;display:grid;place-items:center;text-align:center}
.load img{width:72px;height:72px;border-radius:18px;box-shadow:0 0 40px rgba(152,10,8,.6);animation:p 1.6s ease-in-out infinite}
.load b{display:block;margin-top:16px;letter-spacing:.3em;font-size:15px}
.load small{display:block;color:#ffda7c;letter-spacing:.2em;font-size:11px;margin-top:4px}
.load p{color:#8c7a6c;font-size:12px;margin-top:22px;max-width:300px}
.load a{color:#ffda7c}
@keyframes p{50%{transform:scale(1.06)}}
</style>
</head>
<body>
<div class="load" id="ld"><div><img src="/icons/icon-192.png" alt=""><b>SOFWAH PRISM</b><small>ONE WORKFORCE · ONE INTELLIGENCE · ONE COMMAND</small><p id="msg">Memuatkan…</p></div></div>
<iframe id="app" title="SOFWAH PRISM" allow="clipboard-write; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycby2i0RfEZwKNblO4HYLqIOoi6bQhdOIK27gZattpCVRI-4hGZEYWLjUipAtxr6IM47QqA/exec';
  var PAGE = '';
  var f = document.getElementById('app'), ld = document.getElementById('ld');
  f.src = EXEC + (PAGE ? '?page=' + PAGE : '');
  f.onload = function () { f.className = 'on'; setTimeout(function () { ld.style.display = 'none'; }, 400); };
  setTimeout(function () { if (f.className !== 'on') document.getElementById('msg').innerHTML = 'Sambungan perlahan. <a href="' + f.src + '" rel="noopener">Buka terus</a> atau muat semula.'; }, 15000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});
})();
</script>
</body>
</html>
