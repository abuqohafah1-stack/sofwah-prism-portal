  function recordForm(row) {
    var d = S.data.rec;
    var cur = row ? d.rows.filter(function (r) { return String(r._row) === String(row); })[0] : {};
    var toInputDate = function (v) { var m = String(v || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; };
    var fields = d.schema.map(function (f) {
      var v = cur[f.key] !== undefined ? cur[f.key] : '';
      if (f.auto) return v !== '' ? '<div class="li"><span class="muted">' + h(f.key) + '</span><b>' + h(v) + '</b></div>' : '';
      var name = 'name="' + h(f.key) + '"';
      var inp;
      if (f.type === 'staff') inp = '<select ' + name + ' required' + (row ? ' disabled' : '') + '><option value="">Select staff</option>' + S.staffPick.map(function (s) {
        return '<option value="' + h(s.id) + '"' + (String(s.id).toUpperCase() === String(v).toUpperCase() ? ' selected' : '') + '>' + h(s.nama + ' · ' + s.cawangan + ' · ' + s.id) + '</option>';
      }).join('') + '</select>';

  /** Muat turun fail: Blob + objectURL (data: URL + download tidak dipercayai di Safari iOS / Chrome). */
  function downloadB64(name, b64, mime) {
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 60000);
  }

    if (el.id === 'selfie-input') { if (el.files && el.files[0]) onSelfie(el.files[0]); return; }
    if (el.id === 'doc-input') {

      return;
    }
    if (el.closest('.roster') && el.tagName === 'SELECT' && el.dataset.i !== undefined) {
      el.classList.add('changed');
      var kat = {};
      (S.data.roster ? S.data.roster.shifts : []).forEach(function (s) { kat[s.kod] = s.kategori; });
      el.className = el.className.replace(/k-\S+/g, '').trim() + (kat[el.value] ? ' k-' + kat[el.value] : '');

    var act = el.dataset.act;
    if (act === 'branch') { S.branch = el.value; loadUrus(); }
    else if (act === 'payMonth') { S.payMonth = el.value; if ((S.data.payStatus || { months: [] }).months.some(function (m) { return m.bulan === el.value; })) loadPayMonth(el.value); else $('pay-body').innerHTML = '<div class="card"><div class="empty">' + h(el.value) + '  not processed yet. Tap Run payroll.</div></div>'; }

      call('setRole', { id: el.dataset.id, role: el.value, skop: skop ? skop.value : '' }).then(function () { toast('Role updated.'); }).catch(fail);

  /* ======================= Borang (submit) ======================= */
  function formData(form) {
    var o = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (!el.name || el.disabled && el.type !== 'hidden') return;
      if (el.type === 'checkbox') o[el.name] = el.checked;
      else if (el.value !== '' || !(el.name in o)) o[el.name] = el.value;
    });
    return o;
  }

      var d = formData(f); d.telefon = !!(f.elements.telefon && f.elements.telefon.checked);
      if (S.docs && S.docs.greet) d.gambar = S.docs.greet;
      if (d.kategori === 'Ucapan' && !d.gambar) { busy(btn, false); toast('Add a banner image for the Greeting.', true); return; }
      call('addNotice', d).then(function (r) { toast('Announcement posted' + (d.telefon ? ' · sent to ' + (r.telefon || 0) + ' telefon' : '') + '.'); f.reset(); busy(btn, false); }).catch(function (e) { busy(btn, false); fail(e); });
    },
    paySetup: function (f, btn) {
      call('payrollSetup', formData(f)).then(function (r) { toast('PRISM Payroll is ready.'); modal('PRISM Payroll set up', '<p>' + r.notes.map(h).join('<br>') + '</p><a class="btn block" href="' + h(r.url) + '" target="_blank" rel="noopener">Open the file and fill in Staff Salary</a>'); uPayroll(); })
        .catch(function (e) { busy(btn, false); fail(e); });
    },
    payroll: function (f, btn) {
      call('exportPayroll', formData(f)).then(function (r) {
        busy(btn, false);
        $('payroll-out').innerHTML = '<div class="li"><div><div style="font-weight:600">' + h(r.nama) + '</div><div class="muted">' + h(r.staf) + ' staff</div></div><a class="btn small" href="' + h(r.url) + '" target="_blank" rel="noopener">Open</a></div>';
      }).catch(function (e) { busy(btn, false); fail(e); });
    }
  };

  document.addEventListener('submit', function (e) {
    var f = e.target;
    var fn = FORMS[f.dataset.form];
    if (!fn) return;
    e.preventDefault();
    var btn = f.querySelector('[type=submit]');
    busy(btn, true);
    fn(f, btn);
  });

  /* ======================= Mula ======================= */
  function boot() {
    if (!FRAME_OK) {
      $('app').innerHTML = '<div class="login"><div class="card"><div class="row"><div class="logo">P</div><div><h1>PRISM HR</h1><div class="muted">Sofwah Arabic Grill</div></div></div>' +
        '<p>For security, PRISM HR opens only through the official link.</p><a class="btn block" href="https://prism.sofwah.my/hr/" target="_top" rel="noopener">Open prism.sofwah.my/hr</a></div></div>';
      return;
    }
    if (navigator.onLine === false) setOffline(true);
    var tok = LS.get('prism_token');
    if (!tok) { renderLogin(); return; }
    S.token = tok;
    // Buka serta-merta daripada profil tersimpan; sahkan dengan pelayan di latar.
    var cachedMe = null;
    try { cachedMe = JSON.parse(LS.get('prism_me') || 'null'); } catch (e) { cachedMe = null; }
    if (cachedMe && cachedMe.privasi && !cachedMe.tukarPin) { S.me = cachedMe; renderShell(); }
    call('me').then(function (me) {
      var changed = !S.me || S.me.role !== me.role || S.me.cawangan !== me.cawangan || S.me.privasi !== me.privasi || S.me.tukarPin !== me.tukarPin || String(S.me.scope) !== String(me.scope);
      S.me = me; LS.set('prism_me', JSON.stringify(me));
      if (changed) renderShell();
    }).catch(function (e) {
      if (e && e.transport && S.me) { setOffline(true); return; } // tiada internet: kekal dengan data tersimpan
      LS.del('prism_token'); LS.del('prism_me'); S.token = null; S.me = null; renderLogin();
    });
  }
  boot();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/hr/sw.js', { scope: '/hr/' }).catch(function () {});
  var hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadCtl && Date.now() - window.__t0 < 8000 && !window.__reloaded) { window.__reloaded = true; location.reload(); }
  });
}
if (location.protocol === 'http:' && /(^|\.)sofwah\.my$/.test(location.hostname)) location.replace('https://' + location.host + location.pathname + location.search);
</script>
