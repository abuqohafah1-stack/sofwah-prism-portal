  <style>
:root{
  --navy:#121a2e; --navy-2:#1f2940; --orange:#f26210; --orange-ink:#c24e08; --orange-soft:#fff1e8;
  --ink:#121a2e; --muted:#5b6b8c; --line:#dde1e8; --bg:#eef0f3; --card:#ffffff;
  --green:#1d793c; --green-soft:#e6f4e9; --red:#c62828; --red-soft:#fdecea; --blue:#1d4ead; --blue-soft:#e7effc;
  --radius:16px; --nav-h:68px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
a{color:var(--orange-ink)}
h1,h2,h3{margin:0;line-height:1.2}
.boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.logo{width:40px;height:40px;border-radius:11px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}

/* Kerangka */
.shell{min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.04em}
.brand .logo{width:28px;height:28px;border-radius:8px;font-size:14px}
.top .sub{color:#c9cfdb;font-size:12px}
.top h1{font-size:22px;margin-top:10px}
.main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.narrow{max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav-in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;min-height:var(--nav-h);background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;cursor:pointer}
.nav button[aria-current="page"]{color:var(--orange-ink);font-weight:600}
.nav svg{width:22px;height:22px}

/* Komponen */
.card{background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(18,26,46,.06)}
.card.dark{background:var(--navy);color:#fff}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.card.dark .eyebrow{color:#c9cfdb}
.big{font-size:30px;font-weight:700;line-height:1.1}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg)}
.li:last-child{border-bottom:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.orange{background:var(--orange-soft);color:#a8430a}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.btn{min-height:48px;border:0;border-radius:12px;padding:0 18px;font-weight:600;cursor:pointer;background:var(--orange);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.dark{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #c9cfdb}
.btn.green{background:var(--green)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn.huge{min-height:60px;font-size:18px;border-radius:14px}
.icon-btn{min-width:44px;min-height:44px;border:0;background:none;font-size:18px;cursor:pointer;color:inherit}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #c9cfdb;background:#fff;color:var(--ink);font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:26px;line-height:1.1}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 0}

/* Borang */
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{min-height:46px;padding:10px 12px;border:1px solid #c9cfdb;border-radius:10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid rgba(242,98,16,.35);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--red);font-size:13px}

/* Jadual (grid pengurus) */
.table-box{overflow-x:auto;background:#fff;border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bg);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:#fafbfc;position:sticky;top:0}
td.name{white-space:nowrap;font-weight:600;position:sticky;left:0;background:#fff;z-index:1}
.roster select{min-height:38px;padding:4px 6px;font-size:13px;min-width:86px;border-radius:8px}
.roster select.k-Pagi{background:var(--blue-soft)}
.roster select.k-Petang{background:var(--orange-soft)}
.roster select.k-Split{background:#f1effa}
.roster select.k-Rehat{background:var(--bg)}
.roster select.changed{outline:2px solid var(--orange)}
.cuti-tag{display:block;font-size:10px;color:var(--red);font-weight:600}
.semakan{font-size:12px;color:var(--red);min-width:180px}

/* Hari ini */
.today-day{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bg)}
.today-day.now{background:#fff7f1;box-shadow:inset 3px 0 0 var(--orange)}
.times{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.times div{background:var(--bg);border-radius:10px;padding:8px 10px}
.times b{display:block;font-size:17px}

/* Staffing Planner */
.staff-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.staff-slot{border-top:4px solid var(--green)}
.staff-slot.red{border-top-color:var(--red)}
.staff-slot.orange{border-top-color:var(--orange)}
.staff-meter{position:relative;height:10px;background:var(--bg);border-radius:5px}
.staff-meter>i{display:block;height:100%;border-radius:5px;background:var(--navy)}
.staff-meter>b{position:absolute;top:-4px;width:3px;height:18px;margin-left:-1px;background:var(--orange);border-radius:2px}
.hchart{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:46px 1fr 64px 64px;align-items:center;gap:8px;font-size:13px}
.hlab{color:var(--muted)}
.hval{text-align:right;font-weight:600}
.hrm{text-align:right;color:var(--muted)}
.hbar{position:relative;height:14px;background:var(--bg);border-radius:4px}
.hbar>i{display:block;height:100%;border-radius:4px;background:var(--navy)}
.hbar>i.red{background:var(--red)}
.hbar>i.orange{background:#e8a33d}
.hbar>b{position:absolute;top:-3px;width:3px;height:20px;margin-left:-1px;background:var(--orange);border-radius:2px}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin:0 2px 0 8px}
.lg.ok{background:var(--navy)}
.lg.mk{background:var(--orange);width:3px}
@media (max-width:420px){.hrow{grid-template-columns:40px 1fr 56px}.hrm{display:none}}

/* Modal & toast */
.modal{position:fixed;inset:0;background:rgba(18,26,46,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal[hidden]{display:none}
.modal-card{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal-card{border-radius:20px}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.modal-head h2{font-size:18px}
#offline{display:none;position:fixed;top:0;left:0;right:0;z-index:70;background:var(--red);color:#fff;font-size:13px;padding:8px 14px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
#toast.show{opacity:1}
#toast.bad{background:var(--red)}
.pin-show{font-size:40px;font-weight:700;letter-spacing:.2em;text-align:center;padding:12px;background:var(--bg);border-radius:12px}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Log masuk */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;background:var(--navy)}
.login .card{width:100%;max-width:380px;padding:24px}
.login h1{font-size:22px}

@media (min-width:900px){
  .cols{display:grid;grid-template-columns:3fr 2fr;gap:14px;align-items:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* Pematuhan */
  .lc-seg { margin-bottom: 4px; }
  .lc-hero { display: grid; grid-template-columns: 180px 1fr; gap: 14px; align-items: center; }
  .lc-ring { width: 170px; height: 170px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1%), #e8e6e1 0); display: grid; place-items: center; box-shadow: 0 8px 24px #121a2e1f; }
  .lc-ring > div { width: 128px; height: 128px; border-radius: 50%; background: var(--card, #fff); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .lc-ring b { font-size: 34px; line-height: 1; } .lc-ring span { font-size: 11px; color: var(--muted, #6b7280); margin-top: 4px; }
  .lc-mod { display: grid; grid-template-columns: 120px 1fr 44px; gap: 8px; align-items: center; padding: 6px 0; font-size: 13px; }
  .lc-bar { height: 10px; border-radius: 6px; background: #eceae5; overflow: hidden; display: flex; }
  .lc-bar i.ok { background: var(--green); } .lc-bar i.bad { background: var(--red); }
  .lc-tl { display: block; position: relative; margin-left: 6px; padding: 8px 0 10px 18px; border-left: 2px solid #e5e2dc; }
  .lc-dot { position: absolute; left: -7px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--orange); }
  .lc-tl.ok .lc-dot { background: var(--green); }
  .lc-acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .lc-acts .card { margin: 0; }
  @media (max-width: 640px) { .lc-hero { grid-template-columns: 1fr; justify-items: center; } .lc-mod { grid-template-columns: 96px 1fr 40px; } }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

/* ===================== PRISM 2.0 · Soft 3D (warna Sofwah kekal) ===================== */
:root{--bg:#e9ecf2;--card:#e9ecf2;--muted:#56607a;--line:#d6dbe4;
  --neu:8px 8px 18px #c6cbd6,-8px -8px 18px #ffffff;--neu-s:5px 5px 11px #c6cbd6,-5px -5px 11px #ffffff;
  --neu-in:inset 4px 4px 9px #c6cbd6,inset -4px -4px 9px #ffffff;--radius:24px}
html,body{background:var(--bg)}
.top{background:var(--bg);color:var(--ink);padding:calc(18px + env(safe-area-inset-top)) 18px 4px}
.top .sub{color:var(--muted)}
.top h1{font-size:20px;margin:0;letter-spacing:-.2px}
.top .brand{font-size:12px;color:var(--muted);gap:6px}
.avatar{width:46px;height:46px;border-radius:16px;background:var(--bg);box-shadow:var(--neu-s);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--orange)}
.main{padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}
.nav{background:transparent;border:0;bottom:calc(12px + env(safe-area-inset-bottom));padding:0 14px}
.nav-in{background:var(--navy);border-radius:26px;box-shadow:0 14px 30px rgba(18,26,46,.32);padding:6px}
.nav button{color:#aeb6c7;min-height:58px;border-radius:20px}
.nav button[aria-current="page"]{color:#fff;font-weight:600}
.nav button[aria-current="page"] svg{background:var(--orange);border-radius:12px;padding:5px;width:32px;height:32px;box-shadow:0 0 16px rgba(242,98,16,.6)}
.card{background:var(--bg);box-shadow:var(--neu);border-radius:var(--radius)}
.card.dark{background:linear-gradient(135deg,#121a2e,#1f2940);box-shadow:0 14px 28px rgba(18,26,46,.25)}
.tile{background:var(--bg);box-shadow:var(--neu);border-radius:22px}
.tile.dark{background:var(--navy);color:#fff}.tile.dark .muted{color:#c9cfdb}
.btn{border-radius:16px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.16),0 10px 20px rgba(242,98,16,.3);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.dark{box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),0 10px 20px rgba(18,26,46,.25)}
.btn.green{box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 10px 20px rgba(29,121,60,.25)}
.btn.ghost{background:var(--bg);border:0;box-shadow:var(--neu-s)}
.seg button{background:var(--bg);border:0;box-shadow:var(--neu-s)}
.seg button[aria-pressed="true"]{background:var(--navy);box-shadow:0 8px 16px rgba(18,26,46,.25)}
.seg{padding:6px 4px 10px}
input,select,textarea{background:var(--bg);border:0;box-shadow:var(--neu-in);border-radius:14px}
.chip{background:rgba(18,26,46,.07)}
.li{border-bottom:1px solid rgba(18,26,46,.07)}
.times div{background:var(--bg);box-shadow:var(--neu-in);border-radius:14px}
.table-box{background:#f7f8fb;box-shadow:var(--neu);border-radius:20px}
th{background:#eef1f5} td.name{background:#f7f8fb}
.modal-card{background:var(--bg)}
.login .card{box-shadow:var(--neu)}
#toast{border-radius:16px;bottom:calc(var(--nav-h) + 40px)}

/* Hari ini */
.hero{align-items:center;text-align:center;gap:14px;padding:20px 18px 18px;position:relative}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--bg);box-shadow:var(--neu-in)}
.led{background:var(--navy);border-radius:20px;padding:8px 20px;display:inline-flex;align-items:center;gap:10px;color:#fff;box-shadow:inset 0 0 0 2px #1f2940,0 10px 20px rgba(18,26,46,.25)}
.led.small{padding:6px 14px;border-radius:14px}
.led-hm{font-family:"Space Grotesk",ui-monospace,monospace;font-size:32px;font-weight:700;letter-spacing:2px;text-shadow:0 0 14px rgba(242,98,16,.85)}
.led.small .led-hm{font-size:18px}
.led small{font-family:"Space Grotesk",monospace;color:#ff9a5c;font-size:14px}
.led-dot{width:8px;height:8px;border-radius:50%;background:#ff8a3d;box-shadow:0 0 10px #ff8a3d}
.led-dot.ok{background:#3ddc84;box-shadow:0 0 10px #3ddc84}
.colon{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.3}}
.shift-line{display:flex;flex-direction:column;gap:2px}
.shift-line b{font-size:20px}
.dial-wrap{position:relative;width:236px;height:236px;margin:2px auto}
.dial-pit{width:236px;height:236px;border-radius:50%;background:var(--bg);box-shadow:inset 10px 10px 22px #c4c9d4,inset -10px -10px 22px #fff;display:flex;align-items:center;justify-content:center}
.dial-ring{--p:0;width:212px;height:212px;border-radius:50%;background:conic-gradient(var(--orange) calc(var(--p) * 1%),#d6dae3 0);display:flex;align-items:center;justify-content:center}
.dial{width:176px;height:176px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:radial-gradient(circle at 35% 28%,#34405e 0%,#1f2940 38%,#121a2e 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;animation:glow 2.4s ease-in-out infinite;transition:transform .15s;font-family:inherit}
.dial b{font-size:17px}.dial small{font-size:11px;color:#c9cfdb;max-width:140px}
.dial .dial-ico{width:40px;height:40px;color:#ff8a3d}
.dial.hold{transform:scale(.95)}
.dial.full{animation:glowHot .5s ease-in-out infinite}
.dial.done{animation:none;background:radial-gradient(circle at 35% 28%,#2b8a4b,#1d793c 45%,#145a2c);box-shadow:0 0 0 2px #1d793c,0 0 26px rgba(29,121,60,.45)}
.dial.done .dial-ico{color:#fff}
.dial:disabled{cursor:default;opacity:1}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px #f26210,0 0 24px 4px rgba(242,98,16,.5),inset 0 0 16px rgba(242,98,16,.3)}50%{box-shadow:0 0 0 2px #ff8a3d,0 0 42px 10px rgba(242,98,16,.7),inset 0 0 24px rgba(242,98,16,.45)}}
@keyframes glowHot{0%,100%{box-shadow:0 0 0 3px #ff8a3d,0 0 50px 14px rgba(242,98,16,.85)}50%{box-shadow:0 0 0 3px #fff,0 0 60px 18px rgba(242,98,16,.95)}}
.conf-layer{position:absolute;inset:0;pointer-events:none}
.conf-layer i{position:absolute;left:50%;top:50%;width:9px;height:14px;border-radius:3px;animation:burst 1.3s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg) scale(1);opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.geo-note{display:inline-flex;align-items:center;gap:6px;justify-content:center}
.geo-note svg{width:15px;height:15px;color:var(--green)}
.t-ico svg{width:20px;height:20px;color:#ff8a3d}

  function shrinkImage(file, maxW, q) {
    if (file.type === 'application/pdf') {
      if (file.size > 1500000) return Promise.reject(new Error('PDF too large (max 1.5 MB). Take a photo instead.'));
      return readFile(file);
    }
    return readFile(file).then(function (url) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxW / img.width);
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', q));
        };
        img.onerror = function () { reject(new Error('Couldn’t read the photo.')); };
        img.src = url;
      });
    });
  }

  /* Kotak OTP: auto-lompat, Backspace, tampal 6 digit, auto-hantar bila lengkap; kira detik 60 s untuk hantar semula */
  function otpWire(mode, email) {
    var bx = [].slice.call(document.querySelectorAll('.otp-box')), form = document.querySelector('[data-form=verifyCode]');
    var sync = function () {
      var v = bx.map(function (b) { return b.value; }).join('');
      form.querySelector('[name=code]').value = v;
      if (/^\d{6}$/.test(v) && !form.dataset.busy) { form.dataset.busy = '1'; form.requestSubmit ? form.requestSubmit() : form.querySelector('[type=submit]').click(); }
    };
    var fill = function (from, digits) {
      digits.split('').forEach(function (d, j) { if (bx[from + j]) bx[from + j].value = d; });
      var nx = bx[Math.min(from + digits.length, 5)]; if (nx) nx.focus();
      sync();
    };
    bx.forEach(function (b, i) {
      b.addEventListener('input', function () {
        var d = b.value.replace(/\D/g, '');
        if (d.length > 1) { fill(i, d.slice(0, 6 - i)); return; }
        b.value = d;
        if (d && bx[i + 1]) bx[i + 1].focus();
        sync();
      });
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' && !b.value && bx[i - 1]) { bx[i - 1].focus(); bx[i - 1].value = ''; e.preventDefault(); }
      });
      b.addEventListener('paste', function (e) {
        var t = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\D/g, '');
        if (t) { e.preventDefault(); fill(0, t.slice(0, 6)); }
      });
      b.addEventListener('focus', function () { b.select(); });
    });
    bx[0].focus();
    var rs = document.querySelector('[data-act=otpResend]'), left = 60;
    var tick = function () {
      if (!document.body.contains(rs)) { clearInterval(S.otpTimer); return; }
      left--;
      rs.disabled = left > 0;
      rs.textContent = left > 0 ? 'Resend in ' + left + 's' : 'Resend code';
      if (left <= 0) clearInterval(S.otpTimer);
    };
    tick(); S.otpTimer = setInterval(tick, 1000);
  }

    var longShift = '';

    if (openIn && d.tarikh) {

      '<div class="shift-line"><b>' + h(shiftTitle) + '</b>' + (shiftSub && shiftSub !== shiftTitle ? '<span class="muted">' + h(shiftSub) + '</span>' : '') + '</div>' +

  /** Tahan untuk clock: cincin penuh → lepaskan → kamera dibuka (dalam acara pointerup, jadi pelayar membenarkan). */
  function bindDial() {
    var btn = document.querySelector('.dial[data-act=clock]');
    var ring = $('dial-ring');
    if (!btn || btn.disabled) return;
    var raf = null, t0 = 0, full = false, holding = false;
    var setP = function (p) { ring.style.setProperty('--p', p); };
    var reset = function () { cancelAnimationFrame(raf); holding = false; full = false; btn.classList.remove('hold', 'full'); setP(0); var s = $('dial-sub'); if (s) s.textContent = 'Hold until the ring fills'; };
    var step = function () {
      var p = Math.min(100, (Date.now() - t0) / 8);
      setP(p);
      if (p >= 100 && !full) {
        full = true; btn.classList.add('full');
        var s = $('dial-sub'); if (s) s.textContent = 'Release for selfie';
        if (navigator.vibrate) navigator.vibrate(25);
      }
      if (!full) raf = requestAnimationFrame(step);
    };
    btn.addEventListener('pointerdown', function (e) {
      if (btn.disabled) return;
      e.preventDefault();
      holding = true; full = false; t0 = Date.now();
      btn.classList.add('hold');
      try { btn.setPointerCapture(e.pointerId); } catch (x) { /* abaikan */ }
      raf = requestAnimationFrame(step);
    });
    btn.addEventListener('pointerup', function () {
      if (!holding) return;
      var wasFull = full;
      cancelAnimationFrame(raf);
      holding = false;
      if (wasFull) { S.dialFired = Date.now(); btn.classList.remove('hold'); startClock(); }
      else { reset(); toast('Hold until the ring fills, then release.'); }
    });
    btn.addEventListener('pointercancel', reset);
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.dialFired = Date.now(); startClock(); }
    });
  }

  function celebrate() {
    var layer = $('conf');
    if (!layer) return;
    var colors = ['#f26210', '#ff9a5c', '#121a2e', '#ffd2b3', '#1d793c', '#c24e08'];
    var html = '';
    for (var i = 0; i < 26; i++) {
      var a = (i / 26) * Math.PI * 2, r = 110 + (i % 4) * 26;
      html += '<i style="background:' + colors[i % 6] + ';--dx:' + Math.round(Math.cos(a) * r) + 'px;--dy:' + Math.round(Math.sin(a) * r) + 'px;animation-delay:' + (i % 5) * 0.03 + 's"></i>';
    }
    layer.innerHTML = html;
    setTimeout(function () { if (layer) layer.innerHTML = ''; }, 1600);
    if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
  }

  function startClock() {
    // Kamera dahulu (perlu sentuhan pengguna), lokasi diambil selepas gambar diambil.

  function warmGps() {
    if (S.geoWarm) return;

  function onSelfie(file) {
    var btn = document.querySelector('[data-act=clock]');
    busy(btn, true, 'Getting location…');
    var selfie;
    shrinkImage(file, 480, 0.6).then(function (url) {
      selfie = url;
      return getPos();
    }).then(function (pos) {
      busy(btn, true, 'Sending…');
      var before = (S.data.today || {}).langkah;
      return call('clock', { lat: pos.lat, lng: pos.lng, acc: pos.acc, selfie: selfie }).catch(function (e) {
        if (!e.transport) throw e;
        // Sambungan putus selepas hantar: semak sama ada rekod sudah sampai sebelum minta staf cuba lagi
        busy(btn, true, 'Confirming…');
        return call('today').then(function (t) {
          if (t.langkah !== before) { t.baru = { step: before, masa: (t.rekod || {})[{ masuk: 'masuk', keluar: 'keluar', masuk2: 'masuk2', keluar2: 'keluar2' }[before]] || '', jarak: '', luar: false, disahkan: true }; return t; }
          throw new Error('Record not received (connection dropped). Try again.');
        });
      });
    }).then(function (d) {
      S.data.today = d;
      cacheSet('today', d);
      renderToday(d);
      celebrate();
      var b = d.baru;
      toast((b ? ({ masuk: 'Clock in', keluar: 'Clock out', masuk2: 'Clock in (2)', keluar2: 'Clock out (2)' }[b.step] + ' ' + b.masa) : 'Recorded') +
        (b && b.luar ? ' · OUTSIDE AREA (' + b.jarak + ' m), manager notified' : ' · done'), b && b.luar);
    }).catch(function (e) {
      busy(btn, false);
      fail(e);
    });
  }

  /* ======================= PRISM 3 · Onboarding, kalendar, keselamatan, ucapan ======================= */
  function onbKey() { return 'prism_onb_' + (S.me ? S.me.id : ''); }
  /** Selepas log masuk pertama di peranti ini: notifikasi → lokasi → kalendar (setiap satu sekali tekan). */
  function onboarding(step) {
    if (window.PRISM_PIN_LOGIN) return; // mod ujian lama
    if (!step && S.onbShown) return;
    S.onbShown = true;
    if (!S.me || LS.get(onbKey()) === 'done') { showGreeting(); return; }
    step = step || 1;
    var ps = pushState();
    var steps = [
      { k: 1, ico: '🔔', t: 'Turn on notifications', d: 'Shift reminders 30 minutes before you start, leave decisions and HR announcements.', btn: ps.s === 'aktif' ? '' : ps.s === 'sedia' ? 'Allow notifications' : '', note: ps.s === 'sedia' || ps.s === 'aktif' ? '' : ps.t, act: 'onbPush' },
      { k: 2, ico: '📍', t: 'Allow location', d: 'Used only when you clock in or out, to confirm you are at your branch.', btn: 'Allow location', act: 'onbLoc' },
      { k: 3, ico: '📅', t: 'Add your shifts to Calendar', d: 'Your shifts, leave and public holidays appear in your phone calendar and update automatically.', btn: 'Add to Calendar', act: 'onbCal' }
    ];
    var x = steps[step - 1];
    if (!x) { LS.set(onbKey(), 'done'); closeModal(); toast('You’re all set. Welcome to PRISM HR.'); showGreeting(); return; }
    S.onbStep = step;
    if (step === 1 && ps.s === 'sedia') pushPrefetch();
    modal('Welcome to PRISM HR', '<div class="onb"><div class="onb-dots">' + steps.map(function (y) { return '<i class="' + (y.k <= step ? 'on' : '') + '"></i>'; }).join('') + '</div>' +
      '<div class="onb-ico">' + x.ico + '</div><h3>' + h(x.t) + '</h3><p class="muted">' + h(x.d) + '</p>' + (x.note ? '<p class="hint">' + h(x.note) + '</p>' : '') +
      (x.btn ? '<button class="btn block" data-act="' + x.act + '">' + h(x.btn) + '</button>' : '<div class="chip green" style="align-self:center">Already on ✓</div>') +
      '<button class="btn ghost block" data-act="onbNext">' + (step < steps.length ? 'Skip for now' : 'Finish') + '</button></div>');
  }

  function calendarCard() {

    else window.location.href = link.webcal;

  /* ======================= Saiz paparan (zoom) ======================= */
  /* Saiz paparan tetap: tiada zoom (pinch / double-tap / auto-zoom input iOS) */
  try { document.documentElement.style.zoom = ''; LS.del('prism_zoom'); } catch (e) { /* abaikan */ }
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });

  /* ======================= Notifikasi telefon & pasang app (PWA) ======================= */
  var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var STANDALONE = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); S.installEvt = e; var b = $('install-btn'); if (b) b.hidden = false; });
  function pushState() {
    if (!PWA) return { s: 'web', t: 'Notifications work only in the PRISM HR app installed from prism.sofwah.my/hr.' };
    if (IOS && !STANDALONE) return { s: 'ios', t: 'iPhone: tap Share (square with arrow) › "Add to Home Screen", then open PRISM HR from the home screen to turn on notifications.' };
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) return { s: 'tiada', t: 'This browser doesn’t support notifications. Use Chrome (Android) or Safari on iOS 16.4+.' };
    if (Notification.permission === 'denied') return { s: 'disekat', t: 'Notifications are blocked. Open phone Settings › PRISM HR › Notifications › Allow.' };
    if (Notification.permission === 'granted' && LS.get('prism_push_ok') === (S.me && S.me.id)) return { s: 'aktif', t: 'On for this phone: shift reminders, leave decisions and announcements.' };
    return { s: 'sedia', t: 'Get shift reminders 30 minutes early, leave decisions and HR announcements.' };
  }
  function pushCard() {
    var st = pushState();
    var install = PWA && !STANDALONE && !IOS ? '<button class="btn ghost small" id="install-btn" data-act="installApp"' + (S.installEvt ? '' : ' hidden') + '>Install app</button>' : '';
    var btns = st.s === 'sedia' ? '<button class="btn small" data-act="pushOn">Turn on notifications</button>'
      : st.s === 'aktif' ? '<button class="btn ghost small" data-act="pushTest">Send test</button><button class="btn ghost small" data-act="pushOn">Re-register</button>' : '';
    return '<section class="card" id="push-card"><div class="between"><span class="eyebrow">Phone notifications</span>' +
      '<span class="chip ' + (st.s === 'aktif' ? 'green' : 'orange') + '">' + (st.s === 'aktif' ? 'Aktif' : st.s === 'sedia' ? 'Off' : 'Action needed') + '</span></div>' +
      '<div class="muted">' + h(st.t) + '</div>' + (btns || install ? '<div class="row wrap" style="margin-top:10px">' + btns + install + '</div>' : '') + '</section>';
  }
  var SCRIPTS = {};
  function loadScript(src) {
    if (!SCRIPTS[src]) SCRIPTS[src] = new Promise(function (res, rej) { var x = document.createElement('script'); x.src = src; x.onload = res; x.onerror = function () { delete SCRIPTS[src]; rej(new Error('Failed to load ' + src)); }; document.head.appendChild(x); });
    return SCRIPTS[src];
  }
  function timeout(p, ms, msg) { return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error(msg)); }, ms); })]); }
  /* Muat awal konfigurasi + Firebase SDK sebaik kad notifikasi dipaparkan, supaya tekan butang terasa segera */
  function pushPrefetch() {
    if (!S.pushPre) {
      var base = 'https://www.gstatic.com/firebasejs/10.12.5/';
      S.pushPre = Promise.all([call('pushConfig'), loadScript(base + 'firebase-app-compat.js').then(function () { return loadScript(base + 'firebase-messaging-compat.js'); })])
        .then(function (r) { return r[0]; });
      S.pushPre.catch(function () { S.pushPre = null; });
    }
    return S.pushPre;
  }
  function pushOn(btn, after) {
    // iOS: permintaan kebenaran mesti berlaku terus dalam sentuhan pengguna (sebelum await)
    var perm = Notification.permission === 'granted' ? Promise.resolve('granted') : Notification.requestPermission();
    busy(btn, true, 'Waiting…');
    pushPrefetch();
    perm.then(function (p) {
      if (p !== 'granted') throw new Error('Notification permission not granted.');
      // Izin diberi: terus ke langkah seterusnya, sambungan peranti berjalan di latar belakang
      if (after) { var a = after; after = null; a(); } else busy(btn, true, 'Connecting…');
      return timeout(pushPrefetch(), 25000, 'Connection is slow. Try again from More › Phone notifications.');
    }).then(function (cfg) {
      if (!cfg.aktif) throw new Error('Notifications not enabled by HQ yet.');
      if (!firebase.apps.length) firebase.initializeApp(cfg.firebase);
      return timeout(navigator.serviceWorker.ready.then(function (reg) {
        return firebase.messaging().getToken({ vapidKey: cfg.vapidKey, serviceWorkerRegistration: reg });
      }), 25000, 'Connection is slow. Try again from More › Phone notifications.');
    }).then(function (token) {
      if (!token) throw new Error('Device token not received.');
      return call('pushRegister', { token: token, platform: (IOS ? 'iOS' : /Android/.test(navigator.userAgent) ? 'Android' : 'Desktop') + (STANDALONE ? ' · app' : ' · browser') });
    }).then(function () {
      LS.set('prism_push_ok', S.me.id);
      toast('Notifications on ✓');
      var c = $('push-card'); if (c) c.outerHTML = pushCard();
    }).catch(function (e) {
      if (document.body.contains(btn)) busy(btn, false);
      toast(e.message, true);
      if (after) after();
    });
  }

  /* ======================= Urus (Manager / HR) ======================= */
  var URUS = [
    { k: 'ringkasan', l: 'Dashboard' }, { k: 'liputan', l: 'Coverage' }, { k: 'kelulusan', l: 'Approvals' },

    { k: 'payroll', l: 'Payroll', hr: true }, { k: 'pematuhan', l: 'Compliance ⚖️', hr: true }

    var sel = needBranch && S.me.scope.length > 1 ? '<label style="max-width:260px">Branch<select data-act="branch">' + S.me.scope.map(function (b) {

      var tun = d.tuntutan.map(function (c) {
        var paid = c.status === 'Lulus';
        return '<div class="card"><div class="between"><div><div style="font-weight:700">' + h(c.nama) + ' · ' + h(c.cawangan) + '</div><div class="muted">' + h(c.jenis) + ' · ' + h(c.tarikh) + '</div></div><b>' + rm(c.amaun) + '</b></div>' +
          (c.keterangan ? '<div>' + h(c.keterangan) + '</div>' : '') + (c.semakan ? '<div class="err">' + h(c.semakan) + '</div>' : '') +
          (safeUrl(c.dokumen) ? '<a href="' + h(safeUrl(c.dokumen)) + '" target="_blank" rel="noopener">View receipt</a>' : '') +
          (paid ? '<div class="row"><span class="chip green">Approve</span><button class="btn green small grow" data-act="decide" data-kind="tuntutan" data-row="' + c.row + '" data-v="Dibayar">Mark paid</button></div>'
            : '<div class="row"><button class="btn dark small grow" data-act="decide" data-kind="tuntutan" data-row="' + c.row + '" data-v="Lulus">Approve</button><button class="btn ghost small grow" data-act="decide" data-kind="tuntutan" data-row="' + c.row + '" data-v="Ditolak">Reject</button></div>') + '</div>';
      }).join('');
      urusBody('<div class="cols"><div class="narrow" style="margin:0"><span class="eyebrow">Pending leave (' + d.cuti.length + ')</span>' + (cuti || '<div class="card"><div class="empty">No leave requests.</div></div>') + '</div>' +
        '<div class="narrow" style="margin:0"><span class="eyebrow">Tuntutan (' + d.tuntutan.length + ')</span>' + (tun || '<div class="card"><div class="empty">No claims.</div></div>') + '</div></div>');
    }).catch(urusErr);
  }

  function weekNav(off, act, label) {
    return '<div class="between"><button class="btn ghost small" data-act="' + act + '" data-v="-1" aria-label="Previous week">‹</button><div style="font-weight:700;text-align:center">' + h(label) +
      '</div><button class="btn ghost small" data-act="' + act + '" data-v="1" aria-label="Next week">›</button></div>';
  }

  function uJadual() {
    var mon = addDays(monday(today()), S.mgrWeekOff * 7);
    call('branchWeek', { cawangan: S.branch, minggu: ymd(mon) }).then(renderRoster).catch(urusErr);
  }

  function renderRoster(w) {
    S.data.roster = w;
    var kat = {};
    w.shifts.forEach(function (s) { kat[s.kod] = s.kategori; });
    var opts = function (val) {
      return '<option value="">–</option>' + w.shifts.map(function (s) {
        return '<option value="' + h(s.kod) + '"' + (s.kod === val ? ' selected' : '') + ' title="' + h(s.teks) + '">' + h(s.kod) + '</option>';
      }).join('');
    };
    var rows = w.rows.map(function (r) {
      return '<tr data-id="' + h(r.id) + '"><td class="name">' + h(r.nama) + '<div class="muted" style="font-weight:400">' + h(r.bahagian) + (r.stesen ? ' · ' + h(r.stesen) : '') + '</div></td>' +
        r.codes.map(function (c, i) {
          return '<td>' + (r.cuti[i] ? '<span class="cuti-tag">' + h(r.cuti[i]) + '</span>' : '') + '<select data-i="' + i + '" class="k-' + h(kat[c] || '') + '" aria-label="' + h(r.nama + ' ' + w.tarikh[i]) + '">' + opts(c) + '</select></td>';
        }).join('') +
        '<td>' + h(r.jam || '') + '</td><td class="semakan">' + h(r.semakan || '') + '</td></tr>';
    }).join('');
    var legend = w.shifts.filter(function (s) { return s.kategori !== 'Lain'; }).map(function (s) { return '<span class="chip">' + h(s.kod) + ' ' + h(s.teks) + '</span>'; }).join(' ');
    urusBody(weekNav(S.mgrWeekOff, 'mweek', w.cawangan + ' · ' + w.label) +
      '<div class="row wrap"><button class="btn ghost small" data-act="copyPrev">Copy last week</button><button class="btn small" data-act="saveWeek">Save schedule</button>' +
      '<span class="hint">Checks run after saving: 1 morning shift a week, max 2 splits, rest day per profile, max 45 hours.</span></div>' +
      '<div class="table-box roster"><table><thead><tr><th>Staff</th>' + w.tarikh.map(function (t) { return '<th>' + h(t) + '</th>'; }).join('') + '<th>Hours</th><th>Checks</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<details class="card"><summary class="eyebrow">Shift code</summary><div class="row wrap">' + legend + '</div></details>');
  }

  function collectRoster() {
    var items = [];
    document.querySelectorAll('.roster tbody tr').forEach(function (tr) {
      var codes = [];
      tr.querySelectorAll('select').forEach(function (s) { codes[Number(s.dataset.i)] = s.value; });
      items.push({ id: tr.dataset.id, codes: codes });
    });
    return items;
  }

  function uTugasan() {
    var mon = addDays(monday(today()), S.mgrWeekOff * 7);
    call('tasks', { cawangan: S.branch, minggu: ymd(mon) }).then(renderTasks).catch(urusErr);
  }

  function renderTasks(d) {
    S.data.tasks = d;
    var staffOpt = function (v) {
      return '<option value="">–</option>' + d.staff.map(function (s) { return '<option value="' + h(s.id) + '"' + (s.id === v ? ' selected' : '') + '>' + h(s.nama) + '</option>'; }).join('');
    };
    var rowHtml = function (r) {
      return '<tr data-row="' + (r.row || '') + '"><td class="name"><select data-f="tugasan">' + d.jenis.map(function (j) { return '<option' + (j === r.tugasan ? ' selected' : '') + '>' + h(j) + '</option>'; }).join('') + '</select></td>' +
        r.ids.map(function (v, i) { return '<td><select data-i="' + i + '">' + staffOpt(v) + '</select></td>'; }).join('') +
        '<td><input data-f="catatan" value="' + h(r.catatan || '') + '" style="min-width:160px"></td><td class="semakan">' + h(r.semakan || '') + '</td></tr>';
    };
    S.data.taskRowHtml = rowHtml;
    var mon = new Date(d.minggu + 'T00:00:00');
    urusBody(weekNav(S.mgrWeekOff, 'mweekT', d.cawangan + ' · week of ' + d.minggu.split('-').reverse().join('/')) +
      '<div class="row wrap"><button class="btn ghost small" data-act="addTask">+ Duty row</button><button class="btn small" data-act="saveTasks">Save duties</button></div>' +
      '<div class="table-box roster"><table><thead><tr><th>Duty</th>' + DAYS.map(function (x, i) { var dd = addDays(mon, i); return '<th>' + x + ' ' + pad(dd.getDate()) + '/' + pad(dd.getMonth() + 1) + '</th>'; }).join('') +
      '<th>Notes</th><th>Checks</th></tr></thead><tbody id="task-rows">' +
      (d.rows.length ? d.rows.map(rowHtml).join('') : rowHtml({ tugasan: d.jenis[0], ids: ['', '', '', '', '', '', ''] })) + '</tbody></table></div>');
  }

  function uKehadiran() {
    var d0 = S.date || ymd(today());
    call('branchAttendance', { cawangan: S.branch, tarikh: d0 }).then(function (rows) {
      var body = rows.length ? rows.map(function (r) {
        if (r.status === 'Tiada rekod') {
          var kls = { absen: 'red', semak: 'orange', cuti: 'blue', rehat: '' }[r.kelas] || '';
          return '<tr><td class="name">' + h(r.nama) + '<div class="muted" style="font-weight:400">' + h(r.kod || '–') + '</div></td>' +
            '<td class="muted">—</td><td><span class="chip ' + kls + '">No record</span></td><td>–</td><td>–</td><td>–</td>' +
            '<td class="muted" style="min-width:160px"><b>Cadangan:</b> ' + h(r.cadangan) + '</td>' +
            (isHR() ? '<td>' + (r.kelas === 'absen' || r.kelas === 'semak' ? '<button class="btn ghost small" data-act="addAtt" data-id="' + h(r.id) + '">Manual record</button>' : '') + '</td>' : '') + '</tr>';
        }
        return '<tr><td class="name">' + h(r.nama) + '<div class="muted" style="font-weight:400">' + h(r.kod) + '</div></td>' +
          '<td>' + h(r.masuk || '—') + ' – ' + h(r.keluar || '—') + (r.masuk2 ? '<br>' + h(r.masuk2) + ' – ' + h(r.keluar2 || '—') : '') + '</td>' +
          '<td><span class="chip ' + chipFor(r.status) + '">' + h(tr(r.status) || '-') + '</span>' + (Number(r.lewat) ? '<div class="muted">late ' + h(r.lewat) + ' min</div>' : '') + '</td>' +
          '<td>' + (r.jarak !== '' && r.jarak !== null ? h(r.jarak) + ' m' : '–') + '</td>' +
          '<td>' + (r.selfie ? '<button class="btn ghost small" data-act="selfie" data-row="' + r.row + '" data-nama="' + h(r.nama) + '">Photo</button>' : '–') + '</td>' +
          '<td>' + (Number(r.ot) > 0 ? '<div class="row"><input type="number" step="0.5" min="0" max="8" value="' + h(r.otLulus !== '' ? r.otLulus : r.ot) + '" style="width:76px;min-height:38px" id="ot-' + r.row + '"><button class="btn small dark" data-act="ot" data-row="' + r.row + '">Approve</button></div><div class="muted">dikira ' + h(r.ot) + ' j</div>' : '–') + '</td>' +
          '<td class="muted" style="min-width:160px">' + h(r.catatan) + '</td>' +
          (isHR() ? '<td><button class="btn ghost small" data-act="fixAtt" data-row="' + r.row + '" data-nama="' + h(r.nama) + '" data-m="' + h(r.masuk) + '" data-k="' + h(r.keluar) + '">Correct</button></td>' : '') + '</tr>';
      }).join('') : '<tr><td colspan="8" class="empty">No attendance records for this date.</td></tr>';
      urusBody('<div class="row wrap"><label style="max-width:220px">Date<input type="date" data-act="date" value="' + h(d0) + '"></label>' +
        (isHR() ? '<button class="btn ghost small" style="margin-top:20px" data-act="addAtt">+ Manual record</button>' : '') + '</div>' +
        '<div class="table-box"><table><thead><tr><th>Staff</th><th>Time</th><th>Status</th><th>Distance</th><th>Photo</th><th>OT</th><th>Notes</th>' + (isHR() ? '<th></th>' : '') + '</tr></thead><tbody>' + body + '</tbody></table></div>');
    }).catch(urusErr);
  }

  /* ---------- Staffing Planner: staf lebih / kurang ikut slot waktu ---------- */
  function uStaffing() {
    call('staffing').then(function (d) { S.data.staffing = d; renderStaffing(d); }).catch(urusErr);
  }

  function staffTone(t) { return t.indexOf('🔴') === 0 ? 'red' : t.indexOf('🟡') === 0 ? 'orange' : 'green'; }
  function n1(x) { return x === null || x === undefined || x === '' ? '–' : (Math.round(Number(x) * 10) / 10).toFixed(1); }
  function rm0(x) { return 'RM' + Math.round(Number(x || 0)).toLocaleString('en-MY'); }

  function renderStaffing(d) {
    var list = d.cawangan;
    if (!list.length) { urusBody('<div class="card"><div class="empty">Staffing Planner covers restaurant branches in your scope only.</div></div>'); return; }
    var b = list.filter(function (c) { return c.cawangan === S.branch; })[0] || list[0];
    var pr = d.param;
    var slots = d.slot.filter(function (x) { return x.cawangan === b.cawangan; });
    var hours = d.jam.filter(function (x) { return x.cawangan === b.cawangan; });
    var modeChip = b.mode === 'Actual clock-ins' ? 'green' : b.mode === 'PRISM schedule' ? 'blue' : 'orange';
    var tiles = [
      ['SPLH ' + b.cawangan, rm0(b.splh), b.splh > pr.splh * 1.5 ? 'well above target RM' + pr.splh + ': staff overloaded, slow service risk' : 'target RM' + pr.splh + ' per staff-hour', b.lampu],
      ['Avg staff on floor', n1(b.serentak), n1(b.bertugas) + ' on duty per day · ' + b.h01 + ' active staff', ''],
      ['Slots to adjust', b.slotTidakSeimbang + ' / 3', b.slotTidakSeimbang ? 'see suggestions below' : 'all slots balanced', ''],
      ['Sales per day', rm0(b.jualanSehari), b.hari + ' trading days counted', '']
    ].map(function (x) { return '<div class="tile"><span class="eyebrow">' + h(x[0]) + '</span><b>' + h(x[1]) + ' ' + h(x[3]) + '</b><span class="muted">' + h(x[2]) + '</span></div>'; }).join('');

    var cards = slots.map(function (x) {
      var tone = staffTone(x.tindakan);
      var nx = x.dijadual === null ? '<span class="muted">Next week: not scheduled</span>'
        : '<span class="muted">Next week scheduled <b>' + n1(x.dijadual) + '</b> · ' + (x.lebihJadual < -1 ? '<span class="chip red">short ' + n1(-x.lebihJadual) + '</span>' : x.lebihJadual > pr.lebihMax ? '<span class="chip orange">over ' + n1(x.lebihJadual) + '</span>' : '<span class="chip green">enough</span>') + '</span>';
      return '<section class="card staff-slot ' + tone + '"><div class="between"><span class="eyebrow">' + h(tr(x.waktu)) + ' · ' + h({ 'Tengah hari': '10:00–14:59', 'Petang': '15:00–17:59', 'Malam': '18:00–22:59' }[x.waktu] || '') + '</span>' +
        '<span class="chip ' + tone + '">' + (x.lebih >= 0 ? '+' : '') + n1(x.lebih) + '</span></div>' +
        '<div class="row" style="align-items:baseline;gap:6px"><span class="big">' + n1(x.serentak) + '</span><span class="muted">on floor · need <b>' + x.perlu + '</b></span></div>' +
        '<div class="staff-meter"><i style="width:' + Math.min(100, Math.round(x.serentak / Math.max(x.perlu, x.serentak, 1) * 100)) + '%"></i><b style="left:' + Math.min(100, Math.round(x.perlu / Math.max(x.perlu, x.serentak, 1) * 100)) + '%"></b></div>' +
        '<div class="muted">Sales ' + rm0(x.jualanSejam) + '/h · SPLH ' + rm0(x.splh) + ' · ' + n1(x.bilSejam) + ' bills/h</div>' +
        '<div style="font-weight:600">' + h(x.tindakan) + '</div>' + nx + '</section>';
    }).join('');

    var maxH = Math.max.apply(null, hours.map(function (x) { return Math.max(x.serentak, x.perlu); }).concat([1]));
    var chart = hours.map(function (x) {
      var tone = x.lebih < -1 ? 'red' : x.lebih > pr.lebihMax ? 'orange' : 'ok';
      return '<div class="hrow"><span class="hlab">' + ('0' + x.jam).slice(-2) + ':00</span><div class="hbar"><i class="' + tone + '" style="width:' + Math.round(x.serentak / maxH * 100) + '%"></i>' +
        '<b style="left:' + Math.round(x.perlu / maxH * 100) + '%" title="perlu ' + x.perlu + '"></b></div><span class="hval">' + n1(x.serentak) + ' / ' + x.perlu + '</span><span class="hrm">' + rm0(x.jualanSejam) + '</span></div>';
    }).join('');

    var overview = list.length > 1 ? '<section class="card"><span class="eyebrow">All branches in scope</span><div class="table-box"><table><thead><tr><th>Branch</th><th>SPLH</th><th>Concurrent</th><th>Slots to adjust</th><th>Staff source</th></tr></thead><tbody>' +
      list.map(function (c) {
        return '<tr' + (c.cawangan === b.cawangan ? ' style="background:#fff7f1"' : '') + '><td class="name"><button class="btn ghost small" data-act="staffBranch" data-v="' + h(c.cawangan) + '">' + h(c.cawangan) + '</button></td><td>' + h(c.lampu) + ' ' + rm0(c.splh) + '</td><td>' + n1(c.serentak) + '</td><td>' +
          (c.slotTidakSeimbang ? '<span class="chip red">' + c.slotTidakSeimbang + '</span>' : '<span class="chip green">0</span>') + '</td><td class="muted">' + h(c.mode) + '</td></tr>';
      }).join('') + '</tbody></table></div></section>' : '';

    urusBody('<div class="between wrap"><div><span class="chip ' + modeChip + '">Staff: ' + h(tr(b.mode)) + '</span> <span class="muted">' + h(d.dari.split('-').reverse().join('/')) + ' – ' + h(d.hingga.split('-').reverse().join('/')) + ' · calculated ' + h(d.dikira) + '</span></div>' +
      (isHR() ? '<button class="btn ghost small" data-act="staffRefresh">Recalculate</button>' : '') + '</div>' +
      '<div class="tiles">' + tiles + '</div>' +
      '<section class="card dark"><span class="eyebrow">Shift move suggestions · ' + h(b.cawangan) + '</span><div style="font-weight:600">' + h(b.cadangan) + '</div></section>' +
      '<div class="staff-slots">' + cards + '</div>' +
      '<section class="card"><div class="between"><span class="eyebrow">By hour · staff on vs needed</span><span class="muted"><i class="lg ok"></i> ada <i class="lg mk"></i> perlu</span></div><div class="hchart">' + chart + '</div>' +
      (b.mode === 'Anggaran' ? '<div class="hint">Estimate mode: staff assumed constant all day. Switches automatically to PRISM schedule / actual clock-ins after ' + pr.minHari + ' days of data (now: schedule ' + b.hariJadual + ' days, clock-in ' + b.hariClockIn + ' days).</div>' : '') + '</section>' +
      overview +
      '<div class="hint">Staff needed = sales per hour ÷ RM' + pr.splh + ' (minimum ' + pr.minStaf + ' people). 🟡 over ' + pr.lebihMax + '+ staff · 🔴 short 1+ staff. Same formula as FIRAX M8; FIRAX reads these numbers from PRISM.</div>');
  }

  /* ---------- Pematuhan Undang-undang (HR / Admin) ---------- */
  var LC_TABS = [['ringkasan', 'Summary'], ['kemaskini', 'Updates'], ['peraturan', 'Rules'], ['akta', 'Acts & amendments'], ['semakan', 'Checks']];
  function lcTone(k) { return k === 'Patuh' ? 'green' : k === 'Tidak patuh' ? 'red' : k === 'Action needed' ? 'orange' : ''; }
  function lcDate(s) { return s ? String(s).split('-').reverse().join('/') : '–'; }
  function lcSeg() {
    if (!S.lcTab) S.lcTab = 'ringkasan';
    return '<div class="seg lc-seg">' + LC_TABS.map(function (t) { return '<button data-act="lcTab" data-v="' + t[0] + '" aria-pressed="' + (S.lcTab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</div>';
  }
  function uPematuhan() {
    var fn = { ringkasan: lcRingkasan, kemaskini: lcKemasKini, peraturan: lcPeraturan, akta: lcAkta, semakan: lcSemakan }[S.lcTab || 'ringkasan'];
    urusBody(lcSeg() + '<div id="lc-body"><div class="card"><div class="empty">Loading…</div></div></div>');
    fn();
  }
  function lcBody(html) { var b = $('lc-body'); if (b) b.innerHTML = html; }
  function lcErr(e) { lcBody(errBox(e)); }

  function lcRingkasan() {
    call('lcDashboard').then(function (d) {
      S.data.lc = d;
      var sk = d.skor === null ? 0 : d.skor;
      var tone = sk >= 85 ? 'var(--green)' : sk >= 65 ? 'var(--orange)' : 'var(--red)';
      var issues = d.checks.filter(function (c) { return c.keputusan === 'Tidak patuh' || c.keputusan === 'Action needed'; });
      var ring = '<div class="lc-ring" style="--p:' + sk + ';--c:' + tone + '"><div><b>' + (d.skor === null ? '–' : sk + '%') + '</b><span>compliance score</span></div></div>';
      var tiles = [
        ['Active rules', d.aktif, d.menungguLulus ? d.menungguLulus + ' pending approval' : 'all approved'],
        ['Open issues', issues.length, issues.filter(function (c) { return c.keputusan === 'Tidak patuh'; }).length + ' tidak patuh'],
        ['Legal updates', d.kemasKiniTerbuka, 'awaiting review'],
        ['Sources monitored', d.sumber.jumlah, d.sumber.gagal ? d.sumber.gagal + ' gagal' : (d.sumber.terakhir ? 'semakan ' + d.sumber.terakhir : 'belum disemak')]
      ].map(function (x) { return '<div class="tile"><span class="eyebrow">' + h(x[0]) + '</span><b>' + h(x[1]) + '</b><span class="muted">' + h(x[2]) + '</span></div>'; }).join('');
      var seeds = d.benih ? '<section class="card dark"><span class="eyebrow">First step</span><div style="font-weight:600">' + d.benih + '  statutory rules (KWSP, PERKESO, SIP, PCB, minimum wage, Employment Act) are loaded and await your approval.</div>' +
        '<div class="muted" style="color:#c9cfdb">Review them in the Rules tab. Once approved, payroll, leave policy and attendance checks follow these values automatically by effective date.</div>' +
        '<div class="row"><button class="btn small" data-act="lcSeeds">Luluskan ' + d.benih + ' peraturan</button><button class="btn ghost small" data-act="lcTab" data-v="peraturan" style="color:#fff;border-color:#fff4">Review first</button></div></section>' : '';
      var mods = d.modul.map(function (m) {
        var t = m.patuh + m.isu + m.belum;
        return '<div class="lc-mod"><span>' + h(m.modul) + '</span><div class="lc-bar"><i class="ok" style="width:' + Math.round(m.patuh / Math.max(t, 1) * 100) + '%"></i><i class="bad" style="width:' + Math.round(m.isu / Math.max(t, 1) * 100) + '%"></i></div><b>' + m.patuh + '/' + t + '</b></div>';
      }).join('');
      var tl = d.upcoming.length ? d.upcoming.map(function (r) {
        var days = Math.round((new Date(r.dari) - today()) / 86400000);
        return '<div class="lc-tl ' + (r.status === 'Diluluskan' ? 'ok' : 'wait') + '"><div class="lc-dot"></div><div><div style="font-weight:600">' + h(r.perkara) + ': ' + h(r.nilai) + ' ' + h(r.unit) + '</div>' +
          '<div class="muted">' + lcDate(r.dari) + ' · ' + days + ' days left · <span class="chip ' + (r.status === 'Diluluskan' ? 'green' : r.status === 'Draf' ? '' : 'orange') + '">' + (r.status === 'Draf' ? 'Awaiting gazette' : h(tr(r.status))) + '</span></div></div></div>';
      }).join('') : '<div class="empty">No scheduled changes.</div>';
      var iss = issues.length ? issues.map(function (c) {
        return '<div class="li"><div><div style="font-weight:600">' + h(c.perkara) + '</div><div class="muted">' + h(c.modul) + ' · ' + h(c.rujukan) + '</div><div class="hint">' + h(c.butiran) + '</div></div><span class="chip ' + lcTone(c.keputusan) + '">' + h(tr(c.keputusan)) + '</span></div>';
      }).join('') : '<div class="empty">No issues. 👏</div>';
      lcBody('<div class="lc-hero">' + ring + '<div class="tiles">' + tiles + '</div></div>' + seeds +
        '<div class="row"><button class="btn ghost small" data-act="lcScan">Re-check now</button><button class="btn ghost small" data-act="lcMonitor">Scan official sources now</button>' +
        '<span class="hint">Automatic daily at 07:15' + (d.ai ? ' · AI analysis on' : '') + '</span></div>' +
        '<div class="grid2"><section class="card"><span class="eyebrow">Legal change timeline</span>' + tl + '</section>' +
        '<section class="card"><span class="eyebrow">Compliance by module</span>' + mods + '</section></div>' +
        '<section class="card"><span class="eyebrow">Needs attention</span><div class="list">' + iss + '</div></section>' +
        '<div class="hint">The Employment Act 1955 applies to Peninsular Malaysia & Labuan only. Sabah / Sarawak branches don’t receive its rules automatically. Announcements (e.g. Budget) stay as Draft until gazetted.</div>');
    }).catch(lcErr);
  }

  function lcKemasKini() {

      var name = 'name="' + h(f.key) + '"';
      var inp;
      if (f.type === 'staff') inp = '<select ' + name + ' required' + (row ? ' disabled' : '') + '><option value="">Select staff</option>' + S.staffPick.map(function (s) {
        return '<option value="' + h(s.id) + '"' + (String(s.id).toUpperCase() === String(v).toUpperCase() ? ' selected' : '') + '>' + h(s.nama + ' · ' + s.cawangan + ' · ' + s.id) + '</option>';
      }).join('') + '</select>';
      else if (f.type === 'select') inp = '<select ' + name + '><option value=""></option>' + (f.options || []).map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + h(o) + '</option>'; }).join('') + '</select>';

  /** Muat turun fail: Blob + objectURL (data: URL + download tidak dipercayai di Safari iOS / Chrome). */
  function downloadB64(name, b64, mime) {
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 60000);
  }

  function safeUrl(u) {

      call('payrollConfirm', { bulan: S.payMonth }).then(function (d) { renderPayMonth(d); toast('Payroll confirmed.'); }).catch(function (e) { busy(el, false); fail(e); });
    },
    payReopen: function (el) {
      busy(el, true);
      call('payrollReopen', { bulan: S.payMonth }).then(function (d) { renderPayMonth(d); toast('Payroll reopened (Draft).'); }).catch(function (e) { busy(el, false); fail(e); });
    },
    payPaid: function (el) {
      var t = window.prompt('Payment date (yyyy-mm-dd):', ymd(today()));
      if (!t) return;
      busy(el, true);
      call('payrollPaid', { bulan: S.payMonth, tarikh: t }).then(function (d) { renderPayMonth(d); toast('Marked paid. Staff can now see their payslips; claims marked Paid.'); }).catch(function (e) { busy(el, false); fail(e); });
    },
    payFiles: function (el) {
      busy(el, true, 'Generating…');
      call('payrollFiles', { bulan: S.payMonth }).then(function (r) {
        busy(el, false);
        S.data.payFiles = r;
        $('pay-files').innerHTML = '<div class="card" style="background:#eef0f3"><span class="eyebrow">' + h(r.slip) + ' payslips saved to Drive · submission files</span><div class="row wrap">' +
          r.files.map(function (f, i) { return '<button class="btn ghost small" data-act="payDl" data-i="' + i + '">' + h(f.nama) + ' (' + h(f.baris) + ')</button>'; }).join('') +
          '<a class="btn ghost small" href="' + h(r.folder) + '" target="_blank" rel="noopener">Drive folder</a></div><span class="hint">Upload the CSVs to i-Akaun, ASSIST and e-PCB Plus after checking totals; the bank file is for bulk transfer.</span></div>';
        toast(r.slip + ' slip dan ' + r.files.length + ' files generated.');
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    payDl: function (el) { var f = S.data.payFiles.files[Number(el.dataset.i)]; downloadB64(f.nama, f.b64, 'text/csv'); },
    paySlip: function (el) { showPayslip(S.payMonth, el.dataset.id, false); },
    mySlip: function (el) { showPayslip(el.dataset.v, S.me.id, true); },
    staffBranch: function (el) { S.branch = el.dataset.v; renderStaffing(S.data.staffing); window.scrollTo(0, 0); },
    staffRefresh: function (el) {
      busy(el, true, 'Calculating…');
      call('staffingRefresh').then(function (d) { S.data.staffing = d; renderStaffing(d); toast('Staffing Planner recalculated.'); }).catch(function (e) { busy(el, false); fail(e); });
    },
    selfie: function (el) {
      busy(el, true);
      call('selfie', { row: Number(el.dataset.row) }).then(function (r) {
        busy(el, false);
        var img = function (lab, src) { return '<div><span class="muted">' + lab + '</span><br>' + (src ? '<img src="' + h(src) + '" alt="' + lab + '" style="max-width:100%;border-radius:12px">' : '<span class="empty">No photo</span>') + '</div>'; };
        modal('Selfie · ' + el.dataset.nama, '<div class="two">' + img('Masuk', r.masuk) + img('Keluar', r.keluar) + '</div>');
      }).catch(function (e) { busy(el, false); fail(e); });
    },
    fixAtt: function (el) {
      modal('Correct attendance · ' + el.dataset.nama, '<form data-form="fixAtt" data-row="' + el.dataset.row + '">' +
        '<div class="two"><label>Time in<input type="time" name="Masa masuk" value="' + h(el.dataset.m) + '"></label><label>Time out<input type="time" name="Masa keluar" value="' + h(el.dataset.k) + '"></label></div>' +
        '<label>Reason<input name="sebab" required placeholder="contoh: lupa clock-out, disahkan pengurus"></label>' +
        '<button class="btn block" type="submit">Save correction</button></form>');
    },
    genPin: function (el) {
      if (!window.confirm((el.textContent.indexOf('Reset') >= 0 ? 'Reset' : 'Jana') + ' PIN untuk ' + el.dataset.nama + '? The old PIN will stop working.')) return;
      busy(el, true);
      call('resetPin', { id: el.dataset.id }).then(function (r) {
        busy(el, false);
        modal('New PIN · ' + r.nama, '<p class="muted">Send this PIN directly to ' + h(r.nama) + ' (' + h(r.id) + '). It isn’t stored and won’t be shown again.</p>' +
          '<div class="pin-show">' + h(r.pin) + '</div><p class="hint">Staff can change their PIN in the app: More › Change PIN.</p><button class="btn block" data-act="closeModal">Done</button>');
        el.textContent = 'Reset PIN'; el.classList.add('ghost');
      }).catch(function (e) { busy(el, false); fail(e); });
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
    var fn = ACT[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'selfie-input') { if (el.files && el.files[0]) onSelfie(el.files[0]); return; }
    if (el.id === 'doc-input') {
      var f = el.files && el.files[0];
      if (!f) return;
      var tgt = S.docTarget;
      shrinkImage(f, 1200, 0.7).then(function (url) {
        S.docs[tgt] = url;
        var lbl = $('doc-' + tgt);
        if (lbl) { lbl.textContent = '✓ ' + f.name.slice(0, 30); lbl.style.color = 'var(--green)'; }
      }).catch(fail);
      return;
    }
    if (el.closest('.roster') && el.tagName === 'SELECT' && el.dataset.i !== undefined) {
      el.classList.add('changed');
      var kat = {};
      (S.data.roster ? S.data.roster.shifts : []).forEach(function (s) { kat[s.kod] = s.kategori; });
      el.className = el.className.replace(/k-\S+/g, '').trim() + (kat[el.value] ? ' k-' + kat[el.value] : '');
      return;
    }
    var act = el.dataset.act;
    if (act === 'branch') { S.branch = el.value; loadUrus(); }
    else if (act === 'payMonth') { S.payMonth = el.value; if ((S.data.payStatus || { months: [] }).months.some(function (m) { return m.bulan === el.value; })) loadPayMonth(el.value); else $('pay-body').innerHTML = '<div class="card"><div class="empty">' + h(el.value) + '  not processed yet. Tap Run payroll.</div></div>'; }
    else if (act === 'date') { S.date = el.value; (S.urus === 'kehadiran' ? uKehadiran : uLiputan)(); }
    else if (act === 'role') {
      var skop = document.querySelector('[data-skop="' + el.dataset.id + '"]');
      call('setRole', { id: el.dataset.id, role: el.value, skop: skop ? skop.value : '' }).then(function () { toast('Role updated.'); }).catch(fail);
    } else if (el.dataset.skop !== undefined) {
      var roleSel = document.querySelector('[data-act=role][data-id="' + el.dataset.skop + '"]');
      call('setRole', { id: el.dataset.skop, role: roleSel.value, skop: el.value }).then(function () { toast('Scope updated.'); }).catch(fail);
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.dataset.act === 'filterAkses') {
      var q = e.target.value.toLowerCase();
      document.querySelectorAll('#akses-table tbody tr').forEach(function (tr) { tr.hidden = q && tr.textContent.toLowerCase().indexOf(q) < 0; });
    }
  });

  /* ======================= Borang (submit) ======================= */
  function formData(form) {
    var o = {};
    Array.prototype.forEach.call(form.elements, function (el) {
      if (!el.name || el.disabled && el.type !== 'hidden') return;
      if (el.type === 'checkbox') o[el.name] = el.checked;
      else if (el.value !== '' || !(el.name in o)) o[el.name] = el.value;
    });
    return o;
  }

  var FORMS = {
    lcPropose: function (f, btn) {
      var d = formData(f); d.key = f.dataset.key; d.juris = f.dataset.juris;
      call('lcPropose', d).then(function (r) { closeModal(); modal('Cadangan ' + r.id + ' dihantar', '<p>Waiting for someone else to approve (maker ≠ checker).</p><span class="eyebrow">Impact analysis</span><ul>' + r.impak.map(function (x) { return '<li>' + h(x) + '</li>'; }).join('') + '</ul><button class="btn block" data-act="closeModal">Got it</button>'); uPematuhan(); })
        .catch(function (e) { busy(btn, false); fail(e); });
    },
    lcReview: function (f, btn) {
      var d = formData(f); d.row = Number(f.dataset.row); d.id = f.dataset.id;
      call('lcReview', d).then(function () { closeModal(); toast('Check saved.'); uPematuhan(); }).catch(function (e) { busy(btn, false); fail(e); });
    },
    lcAddUpd: function (f, btn) {
      call('lcAddUpdate', formData(f)).then(function (r) { closeModal(); toast(r.id + ' direkod.'); S.lcTab = 'kemaskini'; uPematuhan(); }).catch(function (e) { busy(btn, false); fail(e); });
    },
    lcAmend: function (f, btn) {
      var d = formData(f); d.id = f.dataset.id;
      call('lcAmendStatus', d).then(function (r) { closeModal(); toast('Amendment status saved' + (r.draf ? '; ' + r.draf + ' drafts now pending approval' : '') + '.'); uPematuhan(); }).catch(function (e) { busy(btn, false); fail(e); });
    },
    lcCheck: function (f, btn) {
      var d = formData(f); d.id = f.dataset.id;
      call('lcSaveCheck', d).then(function () { closeModal(); toast('Check saved.'); uPematuhan(); }).catch(function (e) { busy(btn, false); fail(e); });
    },
    loginEmail: function (f, btn) {
      var d = formData(f);
      d.email = String(d.email || '').trim();
      call('loginEmail', d).then(signedIn).catch(function (e) { busy(btn, false); LS.set('prism_email', d.email); renderEmailLogin(e.message); });
    },
    emailCode: function (f, btn) {
      var d = formData(f), mode = f.dataset.mode;
      d.email = String(d.email || '').trim().toLowerCase(); d.mode = mode;
      call('emailCode', d).then(function () { LS.set('prism_email', d.email); renderFlow(mode, 2, d.email); })
        .catch(function (e) { busy(btn, false); renderFlow(mode, 1, d.email, e.message); });
    },
    verifyCode: function (f, btn) {
      var d = formData(f), mode = f.dataset.mode;
      if (!/^\d{6}$/.test(d.code || '')) { busy(btn, false); delete f.dataset.busy; toast('Enter the 6-digit code.', true); return; }
      call('verifyCode', { email: d.email, code: d.code }).then(function (r) { S.ticket = r.ticket; renderFlow(mode, 3, d.email); })
        .catch(function (e) {
          busy(btn, false); delete f.dataset.busy;
          if (/expired|Too many/.test(e.message)) { renderFlow(mode, 1, d.email, e.message); return; }
          var err = f.querySelector('.err') || f.insertBefore(document.createElement('div'), f.querySelector('[type=submit]'));
          err.className = 'err'; err.textContent = e.message;
          [].forEach.call(f.querySelectorAll('.otp-box'), function (b) { b.value = ''; b.classList.add('shake'); setTimeout(function () { b.classList.remove('shake'); }, 400); });
          f.querySelector('.otp-box').focus();
        });
    },
    setPassword: function (f, btn) {
      var d = formData(f);
      if (d.password !== d.password2) { busy(btn, false); toast('Passwords don’t match.', true); return; }
      call('setPassword', { email: d.email, ticket: S.ticket, password: d.password }).then(function (r) { S.ticket = null; toast(f.dataset.mode === 'forgot' ? 'Password updated. Welcome back!' : 'Account created. Welcome to PRISM HR!'); signedIn(r); })
        .catch(function (e) { busy(btn, false); if (/expired/.test(e.message)) renderFlow(f.dataset.mode, 1, d.email, e.message); else toast(e.message, true); });
    },
    setPin: function (f, btn) {
      var d = formData(f);
      if (d.pin !== d.pin2) { busy(btn, false); toast('PINs don’t match.', true); return; }
      call('setPin', { pin: d.pin, currentPin: d.currentPin || '' }).then(function () {
        S.me.pinSet = true; if (PWA) LS.set('prism_me', JSON.stringify(S.me));
        toast('PIN saved. Payslip and Profile are now protected.');
        var c = $('sec-card'); if (c) c.outerHTML = securityCard();
      }).catch(function (e) { busy(btn, false); fail(e); });
    },
    unlockPin: function (f, btn) {
      call('unlockPin', formData(f)).then(function () { closeModal(); var t = S.pinThen; S.pinThen = null; if (t) t(); })
        .catch(function (e) { busy(btn, false); fail(e); });
    },
    login: function (f, btn) {
      var d = formData(f);
      d.id = d.id.trim();
      call('login', d).then(function (r) {
        S.token = r.token; S.me = r.me; S.tab = 'hari';
        LS.set('prism_token', r.token); LS.set('prism_id', d.id); LS.set('prism_me', JSON.stringify(r.me));
        renderShell();
      }).catch(function (e) { busy(btn, false); renderLogin(e.message); });
    },
    leave: function (f, btn) {
      var d = formData(f);
      d.dokumen = S.docs.leave || '';
      if (d.jenis === 'Cuti Sakit' && !d.dokumen) { busy(btn, false); fail(new Error('Please attach the MC photo.')); return; }
      call('applyLeave', d).then(function (r) { toast('Request submitted (' + r.hari + ' days). Pending approval.'); loadMohon(); })
        .catch(function (e) { busy(btn, false); fail(e); });
    },
    claim: function (f, btn) {
      var d = formData(f);
      d.resit = S.docs.claim || '';
      if (!d.resit) { busy(btn, false); fail(new Error('Please take a photo of the receipt.')); return; }
      call('submitClaim', d).then(function (r) { toast(r.amaran || 'Claim submitted.', !!r.amaran); S.mohon = 'tuntutan'; loadMohon(); })
        .catch(function (e) { busy(btn, false); fail(e); });
    },
    pin: function (f, btn) {
      var d = formData(f);
      call('changePin', d).then(function () {
        toast('PIN changed.'); f.reset(); busy(btn, false);
        if (S.gate) { S.me.tukarPin = false; S.gate = false; if (PWA) LS.set('prism_me', JSON.stringify(S.me)); closeModal(); route(); }
      }).catch(function (e) { busy(btn, false); fail(e); });
    },
    record: function (f, btn) {
      var data = formData(f);
      call('saveRecord', { tab: S.recTab, row: f.dataset.row ? Number(f.dataset.row) : null, data: data })
        .then(function () { closeModal(); toast('Record saved.'); uRekod(); }).catch(function (e) { busy(btn, false); fail(e); });
    },
    addAtt: function (f, btn) {
      call('addAttendance', formData(f)).then(function () { closeModal(); toast('Manual record saved.'); uKehadiran(); }).catch(function (e) { busy(btn, false); fail(e); });
    },
    fixAtt: function (f, btn) {
      var d = formData(f);
      d.row = Number(f.dataset.row);
      call('fixAttendance', d).then(function () { closeModal(); toast('Attendance corrected.'); uKehadiran(); }).catch(function (e) { busy(btn, false); fail(e); });
    },
    notice: function (f, btn) {
      var d = formData(f); d.telefon = !!(f.elements.telefon && f.elements.telefon.checked);
      if (S.docs && S.docs.greet) d.gambar = S.docs.greet;
      if (d.kategori === 'Ucapan' && !d.gambar) { busy(btn, false); toast('Add a banner image for the Greeting.', true); return; }
      call('addNotice', d).then(function (r) { toast('Announcement posted' + (d.telefon ? ' · sent to ' + (r.telefon || 0) + ' telefon' : '') + '.'); f.reset(); busy(btn, false); }).catch(function (e) { busy(btn, false); fail(e); });
    },
    paySetup: function (f, btn) {
      call('payrollSetup', formData(f)).then(function (r) { toast('PRISM Payroll is ready.'); modal('PRISM Payroll set up', '<p>' + r.notes.map(h).join('<br>') + '</p><a class="btn block" href="' + h(r.url) + '" target="_blank" rel="noopener">Open the file and fill in Staff Salary</a>'); uPayroll(); })
        .catch(function (e) { busy(btn, false); fail(e); });
    },
    payroll: function (f, btn) {
      call('exportPayroll', formData(f)).then(function (r) {
        busy(btn, false);
        $('payroll-out').innerHTML = '<div class="li"><div><div style="font-weight:600">' + h(r.nama) + '</div><div class="muted">' + h(r.staf) + ' staff</div></div><a class="btn small" href="' + h(r.url) + '" target="_blank" rel="noopener">Open</a></div>';
      }).catch(function (e) { busy(btn, false); fail(e); });
    }
  };

  document.addEventListener('submit', function (e) {
    var f = e.target;
    var fn = FORMS[f.dataset.form];
    if (!fn) return;
    e.preventDefault();
    var btn = f.querySelector('[type=submit]');
    busy(btn, true);
    fn(f, btn);
  });

  /* ======================= Mula ======================= */
  function boot() {
    if (!FRAME_OK) {
      $('app').innerHTML = '<div class="login"><div class="card"><div class="row"><div class="logo">P</div><div><h1>PRISM HR</h1><div class="muted">Sofwah Arabic Grill</div></div></div>' +
        '<p>For security, PRISM HR opens only through the official link.</p><a class="btn block" href="https://prism.sofwah.my/hr/" target="_top" rel="noopener">Open prism.sofwah.my/hr</a></div></div>';
      return;
    }
    if (navigator.onLine === false) setOffline(true);
    var tok = LS.get('prism_token');
    if (!tok) { renderLogin(); return; }
    S.token = tok;
    // Buka serta-merta daripada profil tersimpan; sahkan dengan pelayan di latar.
    var cachedMe = null;
    try { cachedMe = JSON.parse(LS.get('prism_me') || 'null'); } catch (e) { cachedMe = null; }
    if (cachedMe && cachedMe.privasi && !cachedMe.tukarPin) { S.me = cachedMe; renderShell(); }
    call('me').then(function (me) {
      var changed = !S.me || S.me.role !== me.role || S.me.cawangan !== me.cawangan || S.me.privasi !== me.privasi || S.me.tukarPin !== me.tukarPin || String(S.me.scope) !== String(me.scope);
      S.me = me; LS.set('prism_me', JSON.stringify(me));
      if (changed) renderShell();
    }).catch(function (e) {
      if (e && e.transport && S.me) { setOffline(true); return; } // tiada internet: kekal dengan data tersimpan
      LS.del('prism_token'); LS.del('prism_me'); S.token = null; S.me = null; renderLogin();
    });
  }
  boot();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/hr/sw.js', { scope: '/hr/' }).catch(function () {});
  var hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadCtl && Date.now() - window.__t0 < 8000 && !window.__reloaded) { window.__reloaded = true; location.reload(); }
  });
}
if (location.protocol === 'http:' && /(^|\.)sofwah\.my$/.test(location.hostname)) location.replace('https://' + location.host + location.pathname + location.search);
</script>
</body>
