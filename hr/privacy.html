<style>:root{--navy:#1B1F4B;--purple:#7A3EFF;--teal:#00C8B5;--cloud:#F6F8FE;--ink:#1F2937;--haze:#64748B}
*{box-sizing:border-box}html,body{margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 70% at 80% 0%,#2A1C6B 0,transparent 60%),linear-gradient(160deg,#262B66,#1B1F4B 55%,#14173A);color:var(--ink);font:400 16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 24px 60px rgba(10,12,40,.35);text-align:center}
.logo{width:84px;height:84px;margin:0 auto 12px;border-radius:22px;background:var(--cloud);display:grid;place-items:center}
h1{margin:4px 0 6px;font:700 22px/1.25 Montserrat,Inter,system-ui,sans-serif;color:var(--navy)}
.addr{display:inline-block;margin:6px 0 18px;padding:6px 12px;border-radius:999px;background:#F1ECFF;color:#5B2ED1;font-weight:600}
.btn{display:block;width:100%;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#9366FF,#7A3EFF 55%,#5B2ED1);color:#fff;font-weight:700;text-decoration:none}
ol{text-align:left;margin:18px 0 0;padding-left:20px;color:var(--ink)}li{margin:6px 0}
.ms{margin-top:16px;color:var(--haze);font-size:14px}
.foot{margin-top:18px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--haze)}</style>
</head>
<body>
<main class="card"><div class="logo"><svg viewBox="0 0 100 100" width="64" height="64" aria-hidden="true"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#B07CFF"/><stop offset=".42" stop-color="#7A3EFF"/><stop offset=".66" stop-color="#6534EE"/><stop offset=".84" stop-color="#2D9CFF"/><stop offset="1" stop-color="#00C8B5"/></linearGradient><radialGradient id="d" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#5FF0E2"/><stop offset="1" stop-color="#00B8C4"/></radialGradient></defs><path d="M16 80 L31 35 C35 23 51 21 56 34 L66 63 C69 73 79 74 82 65 L86 46" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="87" cy="22" r="9.5" fill="url(#d)"/></svg></div><h1>NARA HR · Privacy Policy</h1><a class="btn" id="go" href="https://nara.sofwah.my/hr/privacy.html">Open nara.sofwah.my/hr/privacy.html</a></main>
